    # ĐÃ SỬA: THÊM ID CHO CẢM BIẾN NHIỆT ĐỘ KHỐI 1
    temperature_sensor_1: { name: "b1_temperature_sensor_1", id: "b1_temperature_sensor_1" }
    temperature_sensor_2: { name: "b1_temperature_sensor_2", id: "b1_temperature_sensor_2" }
    temperature_sensor_3: { name: "b1_temperature_sensor_3", id: "b1_temperature_sensor_3" }
    min_cell_voltage: { name: "b1_min_cell_voltage" }
    max_cell_voltage: { name: "b1_max_cell_voltage", id: "b1_max_cell_voltage" }
    cell_voltage_1: { name: "b1_cell_voltage_1" }
    cell_voltage_2: { name: "b1_cell_voltage_2" }
    cell_voltage_3: { name: "b1_cell_voltage_3" }
    cell_voltage_4: { name: "b1_cell_voltage_4" }
    cell_voltage_5: { name: "b1_cell_voltage_5" }
    cell_voltage_6: { name: "b1_cell_voltage_6" }
    cell_voltage_7: { name: "b1_cell_voltage_7" }
    cell_voltage_8: { name: "b1_cell_voltage_8" }
    cell_voltage_9: { name: "b1_cell_voltage_9" }
    cell_voltage_10: { name: "b1_cell_voltage_10" }
    cell_voltage_11: { name: "b1_cell_voltage_11" }
    cell_voltage_12: { name: "b1_cell_voltage_12" }
    cell_voltage_13: { name: "b1_cell_voltage_13" }
    cell_voltage_14: { name: "b1_cell_voltage_14" }
    cell_voltage_15: { name: "b1_cell_voltage_15" }
    cell_voltage_16: { name: "b1_cell_voltage_16" }
    balancing_current: { name: "b1_bal_current", id: "b1_bal_current" }
    
  # ---- BỘ SỐ 2 (SLAVE 280Ah) ----
  - platform: jk_bms_ble
    jk_bms_ble_id: bms2
    total_voltage: { name: "b2_voltage", id: "b2_voltage" }
    current: { name: "b2_current", id: "b2_current" }
    power: { name: "b2_power", id: "b2_power" }
    state_of_charge: { name: "b2_soc", id: "b2_soc" }
    capacity_remaining: { name: "b2_capacity_remaining" }
    delta_cell_voltage: { name: "b2_delta_cell_voltage", id: "b2_delta_cell_voltage" }
    charging_cycles: { name: "b2_charging_cycles" }
    total_charging_cycle_capacity: { name: "b2_total_charging_cycle_capacity" }
    # ĐÃ SỬA: THÊM ID CHO CẢM BIẾN NHIỆT ĐỘ KHỐI 2
    temperature_sensor_1: { name: "b2_temperature_sensor_1", id: "b2_temperature_sensor_1" }
    temperature_sensor_2: { name: "b2_temperature_sensor_2", id: "b2_temperature_sensor_2" }
    temperature_sensor_3: { name: "b2_temperature_sensor_3", id: "b2_temperature_sensor_3" }
    min_cell_voltage: { name: "b2_min_cell_voltage" }
    max_cell_voltage: { name: "b2_max_cell_voltage", id: "b2_max_cell_voltage" }
    cell_voltage_1: { name: "b2_cell_voltage_1" }
    cell_voltage_2: { name: "b2_cell_voltage_2" }
    cell_voltage_3: { name: "b2_cell_voltage_3" }
    cell_voltage_4: { name: "b2_cell_voltage_4" }
    cell_voltage_5: { name: "b2_cell_voltage_5" }
    cell_voltage_6: { name: "b2_cell_voltage_6" }
    cell_voltage_7: { name: "b2_cell_voltage_7" }
    cell_voltage_8: { name: "b2_cell_voltage_8" }
    cell_voltage_9: { name: "b2_cell_voltage_9" }
    cell_voltage_10: { name: "b2_cell_voltage_10" }
    cell_voltage_11: { name: "b2_cell_voltage_11" }
    cell_voltage_12: { name: "b2_cell_voltage_12" }
    cell_voltage_13: { name: "b2_cell_voltage_13" }
    cell_voltage_14: { name: "b2_cell_voltage_14" }
    cell_voltage_15: { name: "b2_cell_voltage_15" }
    cell_voltage_16: { name: "b2_cell_voltage_16" }
    balancing_current: { name: "b2_bal_current", id: "b2_bal_current" }

  # ================= BỘ ĐẾM SỐ ĐIỆN B1 (MASTER 314Ah) =================
  - platform: template
    name: "B1 Power Charge Only"
    id: b1_power_charge_only
    unit_of_measurement: "W"
    update_interval: 5s
    lambda: |-
      if (id(b1_current).state > 0) return id(b1_power).state;
      else return 0.0;

  - platform: template
    name: "B1 Power Discharge Only"
    id: b1_power_discharge_only
    unit_of_measurement: "W"
    update_interval: 5s
    lambda: |-
      if (id(b1_current).state < 0) return std::abs(id(b1_power).state);
      else return 0.0;

  - platform: total_daily_energy
    name: "B1 Daily Charge kWh"
    id: b1_daily_charge_kwh
    power_id: b1_power_charge_only

  - platform: total_daily_energy
    name: "B1 Daily Discharge kWh"
    id: b1_daily_discharge_kwh
    power_id: b1_power_discharge_only

  # ================= BỘ ĐẾM SỐ ĐIỆN B2 (SLAVE 280Ah) =================
  - platform: template
    name: "B2 Power Charge Only"
    id: b2_power_charge_only
    unit_of_measurement: "W"
    update_interval: 5s
    lambda: |-
      if (id(b2_current).state > 0) return id(b2_power).state;
      else return 0.0;

  - platform: template
    name: "B2 Power Discharge Only"
    id: b2_power_discharge_only
    unit_of_measurement: "W"
    update_interval: 5s
    lambda: |-
