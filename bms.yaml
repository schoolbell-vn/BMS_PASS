      else return 0.0;

  - platform: total_daily_energy
    name: "B2 Daily Charge kWh"
    id: b2_daily_charge_kwh
    power_id: b2_power_charge_only

  - platform: total_daily_energy
    name: "B2 Daily Discharge kWh"
    id: b2_daily_discharge_kwh
    power_id: b2_power_discharge_only

