# ================= ĐẨY DỮ LIỆU LÊN THINGSPEAK =================
http_request:
  verify_ssl: false

# ================= TỰ ĐỘNG HÓA VÀ ĐẨY DỮ LIỆU THINGSPEAK =================
interval:
  # 1. Khối đẩy dữ liệu lên ThingSpeak
  - interval: 2min
    then:
      - if:
          condition:
            lambda: |-
              return id(b1_voltage).has_state() && id(b2_voltage).has_state();
          then:
            - http_request.get:
                url: !lambda |-
                  char url[512];
                  sprintf(url, "http://api.thingspeak.com/update?api_key=6K088FEPYQRI9SX1&field1=%.2f&field2=%.2f&field3=%.4f&field4=%.4f&field5=%.2f&field6=%.2f&field7=%.4f&field8=%.4f",
                    id(b1_voltage).state, id(b1_current).state, id(b1_daily_charge_kwh).state, id(b1_daily_discharge_kwh).state,
                    id(b2_voltage).state, id(b2_current).state, id(b2_daily_charge_kwh).state, id(b2_daily_discharge_kwh).state
                  );
                  return url;
            - http_request.get:
                url: !lambda |-
                  char url[512];
                  sprintf(url, "http://api.thingspeak.com/update?api_key=5E0SJRPUMBL0Q76M&field1=%.3f&field2=%.3f&field3=%.1f&field4=%.1f&field5=%.1f&field6=%.1f",
                    id(b1_delta_cell_voltage).state, id(b2_delta_cell_voltage).state,
                    id(b1_temperature_sensor_1).state, id(b1_temperature_sensor_2).state,
                    id(b2_temperature_sensor_1).state, id(b2_temperature_sensor_2).state
                  );
                  return url;

  # 2. KHỐI LOGIC CÂN BẰNG THÔNG MINH (ĐÃ FIX: KIỂM SOÁT ĐỘ LỆCH, ÁP, DÒNG VÀ ĐÈ QUYỀN MANUAL)
  - interval: 10s
    then:
      # ---- B1 (MASTER 314Ah) ----
      - if:
          condition:
            switch.is_on: b1_auto_balance
          then:
            - if:
                condition:
                  and:
                    # Đảm bảo các cảm biến đã có dữ liệu để tránh lỗi chia số 0 hoặc null
                    - lambda: 'return id(b1_max_cell_voltage).has_state() && id(b1_smart_trigger_v).has_state() && id(b1_delta_cell_voltage).has_state() && id(b1_bal_trig_v).has_state() && id(b1_current).has_state();'
                    # Thuật toán tính toán
                    - lambda: |-
                        float max_v = id(b1_max_cell_voltage).state;
                        float trigger_v = id(b1_smart_trigger_v).state;
                        float delta = id(b1_delta_cell_voltage).state;
                        float delta_trigger = id(b1_bal_trig_v).state;
                        float current = id(b1_current).state;
                        
                        // ĐIỀU KIỆN: Áp max vượt ngưỡng + Lệch vượt ngưỡng + Dòng nạp/xả nhỏ hơn 10A
                        return (max_v >= trigger_v) && (delta >= delta_trigger) && (current > -10.0) && (current < 10.0);
                then:
                  - if: # Đủ điều kiện -> BẬT
                      condition:
                        switch.is_off: b1_balancer
                      then:
                        - switch.turn_on: b1_balancer
                else:
                  - if: # Không đủ điều kiện (áp tụt, dòng cao, đã cân bằng xong) -> ÉP TẮT
                      condition:
                        switch.is_on: b1_balancer
                      then:
                        - switch.turn_off: b1_balancer

      # ---- B2 (SLAVE 280Ah) ----
      - if:
          condition:
            switch.is_on: b2_auto_balance
          then:
            - if:
                condition:
                  and:
                    - lambda: 'return id(b2_max_cell_voltage).has_state() && id(b2_smart_trigger_v).has_state() && id(b2_delta_cell_voltage).has_state() && id(b2_bal_trig_v).has_state() && id(b2_current).has_state();'
                    - lambda: |-
                        float max_v = id(b2_max_cell_voltage).state;
                        float trigger_v = id(b2_smart_trigger_v).state;
                        float delta = id(b2_delta_cell_voltage).state;
                        float delta_trigger = id(b2_bal_trig_v).state;
                        float current = id(b2_current).state;
                        
                        return (max_v >= trigger_v) && (delta >= delta_trigger) && (current > -10.0) && (current < 10.0);
                then:
                  - if:
                      condition:
                        switch.is_off: b2_balancer
                      then:
                        - switch.turn_on: b2_balancer
                else:
                  - if:
                      condition:
                        switch.is_on: b2_balancer
                      then:
                        - switch.turn_off: b2_balancer