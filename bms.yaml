    name: "wifi_signal"
    update_interval: 10s
  - platform: uptime
    name: "b1_uptime"
    id: uptime_1
  - platform: uptime
    name: "b2_uptime"
    id: uptime_2
  - platform: ble_client
    ble_client_id: bms_ble_1
    name: "b1_rssi"
    type: rssi
  - platform: ble_client
    ble_client_id: bms_ble_2
    name: "b2_rssi"
    type: rssi

  # ---- BỘ SỐ 1 (MASTER 314Ah) ----
  - platform: jk_bms_ble
    jk_bms_ble_id: bms1
    total_voltage: { name: "b1_voltage", id: "b1_voltage" }
    current: { name: "b1_current", id: "b1_current" }
    power: { name: "b1_power", id: "b1_power" }
    state_of_charge: { name: "b1_soc", id: "b1_soc" }
    capacity_remaining: { name: "b1_capacity_remaining" }
    delta_cell_voltage: { name: "b1_delta_cell_voltage", id: "b1_delta_cell_voltage" }
    charging_cycles: { name: "b1_charging_cycles" }
