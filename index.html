<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>JK BMS Recovery - Tu Physics</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #e9e9e9; text-align: center; padding: 40px; }
        .box { background: #16213e; padding: 30px; border-radius: 20px; display: inline-block; width: 350px; border: 1px solid #0f3460; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        button { background: #e94560; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; margin: 10px 0; font-weight: bold; }
        select { width: 100%; padding: 10px; border-radius: 8px; background: #0f3460; color: white; border: none; margin: 10px 0; }
        #pass { font-size: 40px; color: #00ff41; margin: 20px 0; font-family: monospace; text-shadow: 0 0 10px #00ff41; }
        .status { font-size: 13px; color: #999; }
    </style>
</head>
<body>

    <div class="box">
        <h2>JK BMS Password</h2>
        <button onclick="sendScan()">1. QUÉT TÌM BMS</button>
        <select id="list"><option value="">-- Danh sách BMS --</option></select>
        <button onclick="sendConnect()" style="background:#007bff">2. LẤY MẬT KHẨU</button>
        <div id="pass">******</div>
        <div class="status" id="stat">Đang kết nối Cloud...</div>
    </div>

    <script>
        // Cấu hình HiveMQ Cloud cho Web
        const broker = "0256b04eb4254d4e8c100df19b4db3f7.s1.eu.hivemq.cloud";
        const port = 8884; // Cổng WebSockets SSL của HiveMQ Cloud
        const user = "ngoctuyka";
        const pass = "Tu12345678@";

        const client = new Paho.MQTT.Client(broker, port, "WebUser_" + Math.random());

        client.onMessageArrived = (msg) => {
            if (msg.destinationName === "tu_physics/jkbms/scan_res") {
                let parts = msg.payloadString.split("|");
                let el = document.getElementById("list");
                let opt = document.createElement("option");
                opt.value = parts[0]; opt.text = parts[1];
                el.add(opt);
            } else if (msg.destinationName === "tu_physics/jkbms/pass") {
                document.getElementById("pass").innerText = msg.payloadString;
            } else {
                document.getElementById("stat").innerText = msg.payloadString;
            }
        };

        client.connect({
            useSSL: true,
            userName: user,
            password: pass,
            onSuccess: () => {
                document.getElementById("stat").innerText = "Cloud Online";
                client.subscribe("tu_physics/jkbms/scan_res");
                client.subscribe("tu_physics/jkbms/pass");
                client.subscribe("tu_physics/jkbms/status");
            }
        });

        function sendScan() {
            document.getElementById("list").innerHTML = "";
            client.send("tu_physics/jkbms/cmd", "SCAN");
        }

        function sendConnect() {
            let mac = document.getElementById("list").value;
            if(!mac) return alert("Chọn BMS đã!");
            document.getElementById("pass").innerText = "...";
            client.send("tu_physics/jkbms/connect", mac);
        }
    </script>
</body>
</html>
